<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-purple: #d609ba;
            --neon-color: #dcdcdc;
            --dark-bg: #0d0d0d;
            --light-grey: #cccccc;
            --dark-grey: #333;
        }

        body { 
            font-family: 'Courier New', Courier, monospace;
            text-align: center; 
            margin-top: 20px; 
            background-color: var(--dark-bg);
            color: var(--light-grey);
        }

        h2, h3, h4 {
            color: var(--neon-color);
            text-shadow: 0 0 1px var(--neon-color); 
        }

        .controls { margin-bottom: 20px; }

        button, input, select {
            background-color: transparent;
            border: 2px solid var(--neon-color);
            color: var(--neon-color);
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover, select:hover, input:hover {
            background-color: var(--neon-color);
            color: var(--dark-bg);
            box-shadow: 0 0 5px var(--neon-color);
        }

        input[type="number"] {
            width: 60px;
        }
        
        #puzzle-wrapper {
            display: inline-grid;
            gap: 2px;
            background-color: var(--light-grey); 
            border: 2px solid var(--light-grey);
        }

        #col-hints-container, #row-hints-container {
            display: flex;
            background-color: var(--dark-grey);
            color: var(--light-grey);
        }
        #col-hints-container {
            flex-direction: row;
        }
        #row-hints-container {
            flex-direction: column;
        }
        .solution-hint-container {
            display: flex;
            background-color: var(--dark-grey);
            color: var(--light-grey);
        }
        .cell {
            width: 30px;
            height: 30px;
            background-color: white;
            border: none;
            cursor: pointer;
        }

        .cell.active {
            background-color: black;
            box-shadow: none;
        }

        .hint-box {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 5px;
            min-width: 30px;
            min-height: 30px;
            box-sizing: border-box;
        }
        .col-hint-box {
            flex-direction: column;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--neon-color);
            font-size: 1.5em;
        }

        .spinner {
            border: 8px solid #555;
            border-top: 8px solid var(--neon-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1.5s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h2>Base Editor</h2>
    
    <div class="controls">
        <label>Size: <input type="number" id="rows" value="10" min="10" max="20"></label>
        
        <button onclick="generateGrid()">Update Size</button>
    </div>

    <div id="puzzle-wrapper">
        <div id="corner-box"></div>
        <div id="col-hints-container"></div>
        <div id="row-hints-container"></div>
        <div id="nonogram-container" style="display: inline-grid; gap: 2px;"></div>
    </div>

    <div class="controls" style="margin-top: 20px;">
        <button onclick="LoadFile()">Load File</button>
        <button onclick="saveToFile()">Save to File</button>
        <button onclick="solveNonogram()">Solve</button>
    </div>

    <div id="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Procesando...</p>
    </div>

    <div id="results-container" style="margin-top: 20px; display: none;">
        <h3 id="generation-info"></h3> 

        <div>
            <h4>Fitness Convergence</h4>
            <div style="width: 75%; max-width: 800px; margin: auto;">
                <canvas id="fitness-chart"></canvas>
            </div>
        </div>

        <div style="display: flex; justify-content: center; align-items: flex-start; gap: 40px; margin-top: 20px;">
            <div>
                <h4>Best Solution</h4>
                <div id="solution-container"></div>
            </div>
            <div>
                <h4>Final Population</h4>
                <select id="population-selector" onchange="displaySelectedPopulationMember(this.value)"></select>
                <div id="population-grid-container" style="margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <script>
        let gridState = []; 
        let populationState = [];
        let fitnessChart = null;

        function generateGrid() {
            const rows = parseInt(document.getElementById('rows').value);
            const cols = rows; 
            const wrapper = document.getElementById('puzzle-wrapper');
            const container = document.getElementById('nonogram-container');
            const rowHintsContainer = document.getElementById('row-hints-container');
            const colHintsContainer = document.getElementById('col-hints-container');

            wrapper.style.gridTemplateColumns = `auto 1fr`;
            wrapper.style.gridTemplateRows = `auto 1fr`;
            container.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
            container.innerHTML = '';
            rowHintsContainer.innerHTML = '';
            colHintsContainer.innerHTML = '';
            gridState = [];


            for (let i = 0; i < rows; i++) {
                let rowState = [];
                for (let j = 0; j < cols; j++) {
                    rowState.push(0); // 0 = off, 1 = on
                    
                    const btn = document.createElement('button');
                    btn.className = 'cell';
                    
                    btn.onclick = () => {
                        gridState[i][j] = gridState[i][j] === 0 ? 1 : 0;
                        btn.classList.toggle('active');
                    };
                    
                    container.appendChild(btn);
                }
                gridState.push(rowState);
            }
            
            document.getElementById('corner-box').style.gridArea = '1 / 1 / 2 / 2';
            colHintsContainer.style.gridArea = '1 / 2 / 2 / 3';
            rowHintsContainer.style.gridArea = '2 / 1 / 3 / 2';
            container.style.gridArea = '2 / 2 / 3 / 3';
        }

        function changeGridState(grid){
            changeGridSize(grid);
            const container = document.getElementById('nonogram-container');
            const buttons = container.getElementsByClassName('cell');

            for (let i = 0; i < grid.length; i++) {
                for (let j = 0; j < grid[i].length; j++) {
                    const index = i * grid[i].length + j;
                    gridState[i][j] = grid[i][j]; 
                    if (grid[i][j] === 1) {
                        buttons[index].classList.add('active');
                    } else {
                        buttons[index].classList.remove('active'); 
                    }
                }
            }
        }

        async function saveToFile() {            
            document.getElementById('loading-overlay').style.display = 'flex';
            try {
                const response = await fetch('/nonogram/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ grid: gridState, filename: 'nonogram.csv' })
                });
                
                if (response.ok){
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'nonogram.csv';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    console.error("Error saving file:", response.statusText);
                }
                
            } catch (error) {
                console.error("Error from Flask server:", error);
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }

        async function solveNonogram() {
            try{
                document.getElementById('loading-overlay').style.display = 'flex';
                const response = await fetch('nonogram/solve',{
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ grid: gridState, filename: 'nonogram.csv' })
                });
                if(response.ok){
                    const data = await response.json(); 

                    populationState = data.population;

                    const generationInfo = document.getElementById('generation-info');
                    displayHints(data.row_hints, data.col_hints, 'row-hints-container', 'col-hints-container');

                    const fitnessConvergence = data.fitness_convergence;
                    const lastFitness = fitnessConvergence[fitnessConvergence.length - 1];
                    if (lastFitness === 0) {
                        generationInfo.textContent = `Completed in ${data.generations} generations.`;
                    } else {
                        generationInfo.textContent = `Stoped at ${data.generations}º generation`;
                    }

                    displayFitnessChart(data.fitness_convergence);
                    populatePopulationSelector(populationState, data.row_hints, data.col_hints);
                    displayGridInContainer(data.best, document.getElementById('solution-container'), data.row_hints, data.col_hints); 
                    if (populationState.length > 0) {
                        displayGridInContainer(populationState[0], document.getElementById('population-grid-container'), data.row_hints, data.col_hints);
                    }
                    document.getElementById('results-container').style.display = 'block';
                } else {
                    console.error("Error solving nonogram:", response.statusText);
                }
            }catch (error) {
                console.error("Error from Flask server:", error);
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }

        function displayGridInContainer(grid, container, rowHints, colHints) {
            container.innerHTML = ''; 
            const wrapper = document.createElement('div');
            wrapper.style.display = 'inline-grid';
            wrapper.style.gap = '1px';
            wrapper.style.backgroundColor = 'var(--light-grey)'; 
            wrapper.style.border = '1px solid var(--light-grey)';

            const corner = document.createElement('div');
            const colHintsDiv = document.createElement('div');
            const rowHintsDiv = document.createElement('div');
            colHintsDiv.className = 'solution-hint-container';
            rowHintsDiv.className = 'solution-hint-container';
            const gridDiv = document.createElement('div');

            displayHints(rowHints, colHints, rowHintsDiv, colHintsDiv);

            wrapper.appendChild(corner);
            wrapper.appendChild(colHintsDiv);
            wrapper.appendChild(rowHintsDiv);
            wrapper.appendChild(gridDiv);
            container.appendChild(wrapper);

            corner.style.gridArea = '1 / 1 / 2 / 2';
            colHintsDiv.style.gridArea = '1 / 2 / 2 / 3';
            rowHintsDiv.style.gridArea = '2 / 1 / 3 / 2';
            colHintsDiv.style.flexDirection = 'row';
            rowHintsDiv.style.flexDirection = 'column';
            gridDiv.style.gridArea = '2 / 2 / 3 / 3';

            const rows = grid.length;
            const cols = grid[0].length;
            gridDiv.style.display = 'inline-grid';
            gridDiv.style.gap = '2px';
            gridDiv.style.gridTemplateColumns = `repeat(${cols}, 30px)`;

             for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (grid[i][j] === 1) {
                        cell.classList.add('active');
                    }
                    gridDiv.appendChild(cell);
                }
            }
        }

        function displayHints(rowHints, colHints, rowContainerId, colContainerId) {
            const rowContainer = typeof rowContainerId === 'string' ? document.getElementById(rowContainerId) : rowContainerId;
            const colContainer = typeof colContainerId === 'string' ? document.getElementById(colContainerId) : colContainerId;

            rowContainer.innerHTML = '';
            colContainer.innerHTML = '';
            rowContainer.style.display = 'flex';
            rowContainer.style.flexDirection = 'column';
            rowContainer.style.gap = '2px';
            colContainer.style.display = 'flex';
            colContainer.style.flexDirection = 'row';
            colContainer.style.gap = '2px';

            rowHints.forEach(hints => {
                const hintBox = document.createElement('div');
                hintBox.className = 'hint-box';
                hintBox.textContent = hints.join(' ');
                rowContainer.appendChild(hintBox);
            });

            colHints.forEach(hints => {
                const hintBox = document.createElement('div');
                hintBox.className = 'hint-box col-hint-box';
                hintBox.innerHTML = hints.join('<br>');
                colContainer.appendChild(hintBox);
            });

            rowContainer.style.justifyContent = 'space-around';
            colContainer.style.justifyContent = 'space-around';
        }

        function displayFitnessChart(fitnessData) {
            const ctx = document.getElementById('fitness-chart').getContext('2d');
            const gridColor = 'rgba(220, 220, 220, 0.2)';
            const fontColor = 'rgba(220, 220, 220, 1)';
            const neonColor = 'rgba(220, 220, 220, 1)';
            const labels = Array.from({ length: fitnessData.length }, (_, i) => i + 1);

            if (fitnessChart) {
                fitnessChart.destroy();
            }

            fitnessChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Best Fitness @ Each Generation',
                        data: fitnessData,
                        borderColor: neonColor,
                        backgroundColor: gridColor,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    plugins: { legend: { labels: { color: fontColor } } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Fitness', color: fontColor },
                            ticks: { color: fontColor }, grid: { color: gridColor }
                        },
                        x: {
                            title: { display: true, text: 'Generation', color: fontColor },
                            ticks: { color: fontColor }, grid: { color: gridColor }
                        }
                    }
                }
            });
        }

        function populatePopulationSelector(population, rowHints, colHints) {
            const selector = document.getElementById('population-selector');
            selector.innerHTML = '';
            population.forEach((_, index) => {
                selector.innerHTML += `<option value="${index}">S ${index + 1}</option>`;
            });
            selector.onchange = () => displaySelectedPopulationMember(selector.value, rowHints, colHints);
        }

        function displaySelectedPopulationMember(index, rowHints, colHints) {
            const grid = populationState[parseInt(index)];
            const container = document.getElementById('population-grid-container');
            displayGridInContainer(grid, container, rowHints, colHints);
        }

        function changeGridSize(grid){
            const rows = grid.length;
            document.getElementById('rows').value = rows;
            generateGrid();
        }

        function LoadFile() {
            try{
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.csv';
                
                
                input.onchange = async (event) => {
                    const file = event.target.files[0];
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    const response = await fetch('/nonogram/load', {
                        method: 'POST',
                        body: formData
                    });
                    
                    document.getElementById('loading-overlay').style.display = 'flex';
                    if (response.ok) {
                        const data = await response.json(); 
                        gridState = data.grid; 
                        changeGridState(gridState);
                        displayHints(data.row_hints, data.col_hints, 'row-hints-container', 'col-hints-container');
                    } else {
                        console.error("Error loading file:", response.statusText);
                    }
                    document.getElementById('loading-overlay').style.display = 'none';
                };
                
                input.click();
            } catch (error) {
                console.error("Error from Flask server:", error);
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }
        generateGrid();
    </script>

</body>
</html>
